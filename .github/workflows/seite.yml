# Baut die Seite bei jedem Push auf main und stellt sie auf GitHub Pages bereit.
# Schlägt ein Schritt fehl (Test, Bau, Linkprüfung, Veröffentlichungsprüfung), wird nichts bereitgestellt:
# Die bisherige Seite bleibt online.
name: Seite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Linkprüfung
        run: node pruefung/links.mjs
      - name: Veröffentlichungsprüfung
        run: node pruefung/veroeffentlichung.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  bereitstellen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
